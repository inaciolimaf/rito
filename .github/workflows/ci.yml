# CI: check, back, web, e2e (2 shards) and image run side by side; the gate fails if any of
# them failed or the run lasted more than 300 s. Every step calls a `make` target.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref cancels the previous run. `main` is excluded: every commit on
# main is a published state, and the green/red history of main is what says when something broke.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: the workflow only reads the repository. The gate job adds `actions: read`
# to read the run's start time.
permissions:
  contents: read

env:
  APP_ENV: test
  SECRET_KEY: ci-secret-key-not-for-production
  DATABASE_URL: postgresql+asyncpg://rito_app:rito_app@localhost:5432/rito
  MIGRATIONS_DATABASE_URL: postgresql+asyncpg://rito:rito@localhost:5432/rito
  TEST_DATABASE_URL: postgresql+asyncpg://rito_app:rito_app@localhost:5432/rito_test
  TEST_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://rito:rito@localhost:5432/rito_test
  REDIS_URL: redis://localhost:6379/0
  TEST_REDIS_URL: redis://localhost:6379/15
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  VITE_API_BASE_URL: http://localhost:8000
  S3_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: rito
  S3_REGION: us-east-1
  TEST_S3_ENDPOINT_URL: http://localhost:9000
  TEST_S3_ACCESS_KEY: minioadmin
  TEST_S3_SECRET_KEY: minioadmin
  TEST_S3_BUCKET: rito-test
  TEST_S3_REGION: us-east-1

jobs:
  # Everything that is not a test: lint, build and bundle budget, duplication, dependency audit.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          # Pruning the cache after the job took up to 108 s.
          prune-cache: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: make install-backend

      - name: Install frontend dependencies
        run: make install-frontend

      - name: make lint
        run: make lint

      # Documentation: every domain folder is cited in docs/system/ and no cited path went
      # missing (tools/docs_coverage.py). Its own step, right after lint.
      - name: make docs
        run: make docs

      # Spec 098, rule 7: the bundle budget is checked after the production build.
      - name: make build (production build and bundle gate)
        run: make build

      # Generated API types must match the backend contract (frontend-standard).
      - name: make api-types-check
        run: make api-types-check

      # Spec 119: duplication ceiling per language, thresholds in .jscpd.json.
      - name: make dup
        run: make dup

      # Spec 100, §3: known-vulnerable dependencies fail the PR.
      - name: make audit
        run: make audit

  # Backend suite with coverage (the floor lives in backend/pyproject.toml).
  back:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Data on tmpfs: the CI database is thrown away anyway, and no fsync is needed.
        image: postgres:16
        env:
          POSTGRES_USER: rito
          POSTGRES_PASSWORD: rito
          POSTGRES_DB: rito
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: make install-backend

      - name: Start MinIO
        run: make ci-minio

      - name: Create application role and rito_test database
        run: make ci-db

      # Spec 117: coverage runs in its own step, never inside `make test`.
      - name: make coverage-backend (spec 117 floor)
        run: make coverage-backend

      - name: Publish measured backend coverage
        if: always()
        run: make coverage-summary-backend

  # Frontend suite with coverage (the floor lives in frontend/vite.config.ts).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make install-frontend

      - name: make coverage-frontend (spec 117 floor)
        run: make coverage-frontend

      - name: Publish measured frontend coverage
        if: always()
        run: make coverage-summary-frontend

  # E2E suite, split in two shards that run on separate runners.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rito
          POSTGRES_PASSWORD: rito
          POSTGRES_DB: rito
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: make install-backend

      # The Playwright webServer runs the Vite dev server, so the frontend dependencies are needed here too.
      - name: Install frontend dependencies
        run: make install-frontend

      - name: Install E2E dependencies
        run: make install-e2e

      # Chromium is ~130 MB per run. The key includes the Playwright version (from the lockfile):
      # a browser must match its library, and a cache that survived an upgrade would give a mismatched pair.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # With the browser cached this only installs the system libraries (apt), in seconds.
      - name: Install Playwright browsers
        run: make e2e-browsers

      - name: Start MinIO
        run: make ci-minio

      - name: Create application role and rito_test database
        run: make ci-db

      - name: Apply migrations to the dev database (used by the E2E webServer)
        run: make migrate

      - name: make test-e2e (shard ${{ matrix.shard }}/2)
        run: make test-e2e E2E_ARGS="--shard=${{ matrix.shard }}/2"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Spec 099: the production image is built and started in CI. `docker build` takes longer than
  # the whole suite, so it runs in its own job and does not count against the test jobs.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rito
          POSTGRES_PASSWORD: rito
          POSTGRES_DB: rito
        ports: ["5432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        run: make ci-minio

      - name: Create application role and rito_test database
        run: make ci-db

      - name: make docker-image
        run: make docker-image

      - name: make image-smoke (non-root, no gcc, rito health in production mode)
        run: make image-smoke

  # Runs after the others, whatever their result. Fails if one of them failed or was cancelled,
  # and if the whole run lasted more than 300 s since it started (CLAUDE.md §3).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, back, web, e2e, image]
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: All jobs green
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a job failed or was cancelled"
          exit 1

      - name: Wall clock of the whole run within 300 s
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WALL_CLOCK_BUDGET: "300"
        run: make ci-gate
