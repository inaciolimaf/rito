name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  APP_ENV: test
  SECRET_KEY: ci-secret-key-not-for-production
  DATABASE_URL: postgresql+asyncpg://rito_app:rito_app@localhost:5432/rito
  MIGRATIONS_DATABASE_URL: postgresql+asyncpg://rito:rito@localhost:5432/rito
  TEST_DATABASE_URL: postgresql+asyncpg://rito_app:rito_app@localhost:5432/rito_test
  TEST_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://rito:rito@localhost:5432/rito_test
  REDIS_URL: redis://localhost:6379/0
  TEST_REDIS_URL: redis://localhost:6379/15
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  VITE_API_BASE_URL: http://localhost:8000

jobs:
  test:
    runs-on: ubuntu-latest
    # CLAUDE.md §3: as 3 suítes rodam concorrentes; make test falha se o wall-clock
    # total passar de 120s. Esse job só existe para reproduzir esse gate no CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rito
          POSTGRES_PASSWORD: rito
          POSTGRES_DB: rito
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Cria as roles e bancos de aplicação (rito_app, rito_test)
        run: |
          PGPASSWORD=rito psql -h localhost -U rito -d rito -c \
            "CREATE ROLE rito_app LOGIN PASSWORD 'rito_app';"
          PGPASSWORD=rito psql -h localhost -U rito -d rito -c \
            "CREATE DATABASE rito_test OWNER rito;"

      - name: Instala uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Instala Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências do backend
        working-directory: backend
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instala dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Instala dependências do e2e
        working-directory: e2e
        run: npm ci

      - name: Instala browsers do Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: Publica o wall-clock medido
        if: always()
        run: |
          echo "### Tempo de teste" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat test-timing.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
