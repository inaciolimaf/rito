[project]
name = "rito-backend"
version = "0.1.0"
description = "Rito — sistema de gestão jurídica multi-tenant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "celery>=5.4",
    "redis>=5.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "pillow>=11.0",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.7",
    "num2words>=0.5.14",
    "xhtml2pdf>=0.2.17",
    "langgraph>=1.2.11",
    "sqlglot>=30.17.0",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

# Spec 099, §5: `rito` é a interface de operação — quem está no terminal de produção
# não deveria precisar saber que por baixo é `python -m app.cli`.
[project.scripts]
rito = "app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    # Spec 037: parse do iCal gerado nos testes — validação por parser, não por string.
    "icalendar>=6.1",
    "boto3-stubs[s3]>=1.35",
    "types-openpyxl>=3.1.5.20260724",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH", "ERA", "TID", "ICN", "ASYNC"]
# B008: Depends()/Header() em default de parâmetro é o idioma padrão do FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# CLAUDE.md §9: migration commitada não se edita. As duas ocorrências de ERA001
# (054:30, 088:49) são anteriores a esta spec e ficam onde estão — o ganho de
# apagá-las não paga o precedente de mexer em migration aplicada.
"alembic/versions/*.py" = ["ERA001"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# Celery não tem stubs nem py.typed — os workers rodam fora do caminho testado (a
# regra mora nos services), então o módulo fica como Any.
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# num2words (spec 066, valores por extenso) também não tem stubs nem py.typed — a
# chamada fica isolada em `variables.py`, o retorno é convertido pra `str` explícito
# ali mesmo, então o "Any" não vaza pro resto do módulo.
# Spec 100: os decoradores do Celery (`@celery_app.task`, `@task_prerun.connect`) são
# untyped — a biblioteca não tem stubs nem `py.typed`, o que já está declarado acima —, e
# `strict` recusa qualquer função decorada por untyped. Até a 100 isso era resolvido com
# ~30 `# type: ignore[untyped-decorator]` espalhados, um por task: trinta silenciamentos
# pontuais para UMA causa. Uma exceção declarada no lugar onde a causa mora diz a mesma
# coisa uma vez, e não some quando alguém acrescenta a trigésima primeira task.
#
# O que isto NÃO afrouxa: os corpos das tasks continuam sob `strict`. E eles são finos de
# propósito — a regra de negócio mora nos services, exercitada direto pelos testes
# (CLAUDE.md §3: nenhum teste importa worker).
[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["num2words", "num2words.*"]
ignore_missing_imports = true

# asyncpg não tem stubs nem py.typed. O único lugar que o importa cru é
# `tests/conftest.py`, no SQL de manutenção da spec 105 (`CREATE DATABASE ... TEMPLATE`,
# que não roda dentro de transação e por isso não pode ir pelo engine do SQLAlchemy).
# Todo o resto do projeto fala com o asyncpg pelo SQLAlchemy, que é tipado.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# xhtml2pdf (spec 067, geração de PDF) idem — sem stubs; isolado em `pdf.py`.
[[tool.mypy.overrides]]
module = ["xhtml2pdf", "xhtml2pdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Regra 4 da spec 009: nenhum teste toca rede real. Postgres/Redis locais continuam liberados
# (não é "rede externa"); LLM/DJEN/DataJud (specs 041+) terão fixture gravada, nunca --allow-hosts.
# --allow-hosts pode ser sobrescrito na linha de comando (scripts/run-tests.sh via
# $PYTEST_ALLOW_HOSTS) para ambientes onde Postgres/Redis não estão em localhost.
# `-m "not nightly"`: regra 10 da 098 — o perfilamento com volume tem alvo próprio
# (`make test-nightly`) e não pode entrar no orçamento de 300 s do CI de PR.
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1,localhost -m 'not nightly'"
markers = [
    "slow: teste que passa de 1s — precisa de comentário explicando por quê; máx. 5 no projeto (spec 009, regra 6)",
    # Spec 098, regra 10: perfilamento com volume real (100 mil processos, 1 milhão de
    # movimentações) não cabe nos 300 s do CI de PR. Roda no noturno, contra um banco
    # semeado por `python -m app.core.volume_seed`.
    "nightly: perfilamento com volume — excluído do CI de PR, roda no noturno",
    # Spec 105, regra 8: o teste roda com commit de verdade, fora da transação que a
    # `app_session_factory` abre e desfaz. Só para quem observa o que SÓ existe depois
    # do commit — visão materializada, plano de execução, semântica de transação — e
    # cada uso é justificado no arquivo. `tests/meta/test_isolamento_transacional.py`
    # trava a contagem.
    "commits: precisa de commit real — sessão fora da transação de teste (spec 105)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
