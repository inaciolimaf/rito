[project]
name = "rito-backend"
version = "0.1.0"
description = "Rito — sistema de gestão jurídica multi-tenant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "celery>=5.4",
    "redis>=5.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "pillow>=11.0",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.7",
    "num2words>=0.5.14",
    "xhtml2pdf>=0.2.17",
    "langgraph>=1.2.11",
    "sqlglot>=30.17.0",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

# Spec 099, §5: `rito` é a interface de operação — quem está no terminal de produção
# não deveria precisar saber que por baixo é `python -m app.cli`.
[project.scripts]
rito = "app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    # Spec 037: parse do iCal gerado nos testes — validação por parser, não por string.
    "icalendar>=6.1",
    "boto3-stubs[s3]>=1.35",
    "types-openpyxl>=3.1.5.20260724",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RET",
    "PTH",
    "ERA",
    "TID",
    "ICN",
    "ASYNC",
    "DTZ",
    "C90",
    "PLR0912",
    "PLR0915",
]
# B008: Depends()/Header() em default de parâmetro é o idioma padrão do FastAPI.
ignore = ["B008"]

[tool.ruff.lint.pylint]
# Spec 111. `max-branches` em 8, não nos 12 do padrão da regra. Medido em 02/09/2026: com o
# `max-complexity = 6` da 106 em vigor, a função mais ramificada do projeto tem 8 ramos e
# NENHUMA chega a 9 — um teto em 12 seria decoração, uma regra que não pode disparar.
#
# 8 não é redundante com o `C901`: as duas contam coisas diferentes. O `else` de um `if` é
# 1 ramo para o `PLR0912` e 0 decisões para o mccabe, então `run_due_syncs` fica em C901 6
# (no teto) e 8 ramos. Ramificação LARGA escapa do gate de complexidade; é isso que este
# pega.
#
# Como o teto da 106, este número SÓ DESCE.
max-branches = 8

# Spec 109. `max-statements` no padrão da regra (50) — o `C901` da 106 mede DECISÕES e
# este mede TAMANHO, e as duas coisas são independentes: `create_app` tinha complexidade
# ciclomática 1 (nenhum `if`) e 70 statements, e nenhum gate a alcançava.
#
# 50 é o teto de entrada, não o final: a medição da spec mostra 2 funções acima de 45, 3
# acima de 40 e 10 acima de 30. Descer é trabalho de spec própria, pelo mesmo método de
# degraus da 106 — e, como lá, este número SÓ DESCE.
max-statements = 50

[tool.ruff.lint.mccabe]
# Spec 106, teto final. Chegou aqui em três degraus (10 → 8 → 6), cada um um
# `pyproject.toml` verde e commitado: gate funcionando desde o primeiro passo, em vez de
# uma spec grande que não fecha e deixa o `select` sem `C90` por mais um ciclo.
#
# 6 é apertado de propósito. Na prática, uma função que passa dele está fazendo duas
# coisas — e as 55 que foram simplificadas para chegar aqui viraram, quase sempre, uma
# tabela de despacho ou um par de funções nomeadas. Zero `# noqa: C901` no projeto; o teto
# é 3, e o meta-teste em `tests/meta/test_final_audit.py` o vigia.
#
# Este número SÓ DESCE. Subi-lo é afrouxar o gate e exige spec própria.
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
# CLAUDE.md §9: migration commitada não se edita. As duas ocorrências de ERA001
# (054:30, 088:49) são anteriores a esta spec e ficam onde estão — o ganho de
# apagá-las não paga o precedente de mexer em migration aplicada.
"alembic/versions/*.py" = ["ERA001"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# Celery não tem stubs nem py.typed — os workers rodam fora do caminho testado (a
# regra mora nos services), então o módulo fica como Any.
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# num2words (spec 066, valores por extenso) também não tem stubs nem py.typed — a
# chamada fica isolada em `variables.py`, o retorno é convertido pra `str` explícito
# ali mesmo, então o "Any" não vaza pro resto do módulo.
# Spec 100: os decoradores do Celery (`@celery_app.task`, `@task_prerun.connect`) são
# untyped — a biblioteca não tem stubs nem `py.typed`, o que já está declarado acima —, e
# `strict` recusa qualquer função decorada por untyped. Até a 100 isso era resolvido com
# ~30 `# type: ignore[untyped-decorator]` espalhados, um por task: trinta silenciamentos
# pontuais para UMA causa. Uma exceção declarada no lugar onde a causa mora diz a mesma
# coisa uma vez, e não some quando alguém acrescenta a trigésima primeira task.
#
# O que isto NÃO afrouxa: os corpos das tasks continuam sob `strict`. E eles são finos de
# propósito — a regra de negócio mora nos services, exercitada direto pelos testes
# (CLAUDE.md §3: nenhum teste importa worker).
[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["num2words", "num2words.*"]
ignore_missing_imports = true

# asyncpg não tem stubs nem py.typed. O único lugar que o importa cru é
# `tests/conftest.py`, no SQL de manutenção da spec 105 (`CREATE DATABASE ... TEMPLATE`,
# que não roda dentro de transação e por isso não pode ir pelo engine do SQLAlchemy).
# Todo o resto do projeto fala com o asyncpg pelo SQLAlchemy, que é tipado.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# xhtml2pdf (spec 067, geração de PDF) idem — sem stubs; isolado em `pdf.py`.
[[tool.mypy.overrides]]
module = ["xhtml2pdf", "xhtml2pdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Regra 4 da spec 009: nenhum teste toca rede real. Postgres/Redis locais continuam liberados
# (não é "rede externa"); LLM/DJEN/DataJud (specs 041+) terão fixture gravada, nunca --allow-hosts.
# --allow-hosts pode ser sobrescrito na linha de comando (scripts/run-tests.sh via
# $PYTEST_ALLOW_HOSTS) para ambientes onde Postgres/Redis não estão em localhost.
# `-m "not nightly"`: regra 10 da 098 — o perfilamento com volume tem alvo próprio
# (`make test-nightly`) e não pode entrar no orçamento de 300 s do CI de PR.
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1,localhost -m 'not nightly'"
markers = [
    "slow: teste que passa de 1s — precisa de comentário explicando por quê; máx. 5 no projeto (spec 009, regra 6)",
    # Spec 098, regra 10: perfilamento com volume real (100 mil processos, 1 milhão de
    # movimentações) não cabe nos 300 s do CI de PR. Roda no noturno, contra um banco
    # semeado por `python -m app.core.volume_seed`.
    "nightly: perfilamento com volume — excluído do CI de PR, roda no noturno",
    # Spec 105, regra 8: o teste roda com commit de verdade, fora da transação que a
    # `app_session_factory` abre e desfaz. Só para quem observa o que SÓ existe depois
    # do commit — visão materializada, plano de execução, semântica de transação — e
    # cada uso é justificado no arquivo. `tests/meta/test_isolamento_transacional.py`
    # trava a contagem.
    "commits: precisa de commit real — sessão fora da transação de teste (spec 105)",
]

[tool.coverage.run]
# Spec 117, regra 4: `app/workers/*` fica FORA da medição de cobertura — e a exclusão só
# vale acompanhada do meta-teste da regra 5 (`tests/meta/test_workers_finos.py`). As duas
# coisas ou nenhuma.
#
# Por quê: nenhum teste importa worker. Chamar uma varredura por tenant monta a infra de
# produção e abre um engine por tenant — leva minutos, e é o mesmo motivo pelo qual o
# `disallow_untyped_decorators` já é exceção aqui. Os corpos das tasks são finos de
# propósito: montam infra e despacham; a regra de negócio mora nos services, exercitada
# direto pelos testes. Medir `workers/` seria medir 735 statements de wiring e deixar o
# piso do que importa 2 pontos mais baixo do que ele é.
#
# O risco da exclusão é conhecido: `workers/` viraria o esconderijo natural de código que
# alguém não quis testar. Quem impede isso é o meta-teste, que trava por AST o tamanho de
# cada função de task.
omit = ["app/workers/*"]

[tool.coverage.report]
# Spec 117, regras 2 e 7: piso = valor MEDIDO, arredondado para baixo. Nunca um alvo
# redondo aspiracional — um número que ninguém atinge reprova o PR de quem não causou o
# problema, e o gate morre desligado na semana seguinte. Piso é piso: sobe quando a
# medição sobe, nunca desce. Baixar exige spec própria, igual ao orçamento de wall-clock.
#
# Só morde em execução com `--cov` (o passo próprio de cobertura no CI). O `make test` não
# instrumenta nada e continua sem pagar por isto.
fail_under = 91

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
