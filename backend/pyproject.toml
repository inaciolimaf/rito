[project]
name = "rito-backend"
version = "0.1.0"
description = "Rito — sistema de gestão jurídica multi-tenant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "celery>=5.4",
    "redis>=5.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "boto3-stubs[s3]>=1.35",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends()/Header() em default de parâmetro é o idioma padrão do FastAPI.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Regra 4 da spec 009: nenhum teste toca rede real. Postgres/Redis locais continuam liberados
# (não é "rede externa"); LLM/DJEN/DataJud (specs 041+) terão fixture gravada, nunca --allow-hosts.
# --allow-hosts pode ser sobrescrito na linha de comando (scripts/run-tests.sh via
# $PYTEST_ALLOW_HOSTS) para ambientes onde Postgres/Redis não estão em localhost.
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1,localhost"
markers = [
    "slow: teste que passa de 1s — precisa de comentário explicando por quê; máx. 5 no projeto (spec 009, regra 6)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
