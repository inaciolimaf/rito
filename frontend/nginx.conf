# Servir uma SPA (spec 099, §6).
#
# Duas regras de cache OPOSTAS, e trocá-las é o bug clássico de deploy de SPA:
#
# - os assets têm hash no nome (`index-Duq33bBX.js`). O conteúdo de um nome nunca muda,
#   então podem ser cacheados para sempre — e é o que faz a segunda visita ser instantânea;
# - o `index.html` NÃO tem hash e é quem aponta para os assets. Cacheá-lo faz o navegador
#   continuar pedindo o bundle da versão anterior depois do deploy — que já não existe,
#   e a tela fica branca.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos que não custam nada e fecham três classes de ataque.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Rota de SPA: qualquer caminho desconhecido devolve o index, e o React Router
    # resolve. Sem isto, recarregar a página em `/lawsuits/123` dá 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
